# Local dev infra for the FastAPI backend (api/) — Redis cache + Postgres audit log.
# Run alongside `uvicorn api.main:app --reload` and `npm run dev` (frontend/), which
# you run directly rather than in Docker. Matches the defaults in rag/cache.py and
# api/audit.py, so no .env changes are needed to use this as-is.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# This is separate from docker-compose.yml (the containerized Streamlit app) since
# that's a different deployment path from the FastAPI + Next.js stack here.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legal_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_dev_data:
  postgres_dev_data:
